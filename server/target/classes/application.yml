# PMIS Docket Server — shared settings
spring:
  application:
    name: docket-server
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 20GB
      max-request-size: 20GB
      file-size-threshold: 1MB

server:
  port: 8080

docket:
  # Folder on the server's disk where all file contents are stored.
  storage-root: ./docket-data/storage
  # How long a sign-in stays valid.
  session-hours: 12
  # Name shown to users for the company space.
  company-name: PMIS
